services:
  # Unified Full-Stack Service
  - type: web
    name: mbabazi-closet
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix backend && npm install --prefix frontend --include=dev && NODE_OPTIONS='--max-old-space-size=4096' npm run build --prefix frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        value: /api
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://mbabazi-closet.onrender.com
      - key: API_BASE_URL
        value: https://mbabazi-closet.onrender.com/api
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 5000
