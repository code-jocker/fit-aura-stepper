services:
  # Unified Full-Stack Service
  - type: web
    name: fit-aura-steppers
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://fit-aura-steppers.onrender.com # Change this if your name is different
